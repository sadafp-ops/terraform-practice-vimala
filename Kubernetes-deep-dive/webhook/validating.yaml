apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: pe-validating
webhooks:
- name: validate.platform.demo
  rules:
  - apiGroups: [""]
    apiVersions: ["v1"]
    operations: ["CREATE"]
    resources: ["pods"]
  clientConfig:
    service:
      name: pe-webhook
      namespace: platform-demo
      port: 8443
      path: /validate
    caBundle: ""
  admissionReviewVersions: ["v1"]
  sideEffects: None
 