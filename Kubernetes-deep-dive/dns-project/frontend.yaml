apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:    
       containers:
         - name: frontendend-app
           image: curlimages/curl 
           command: ["sleep", "3600"]